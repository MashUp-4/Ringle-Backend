spring:
  application:
    name: mashup4-backend

  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mashup4}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: "${DB_USERNAME:mashup4}"
    password: "${DB_PASSWORD:mashup4}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
